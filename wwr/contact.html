<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rafting Site - Contact Us</title>
    <meta name="author" content="Santiago Padilla">
    <meta name="description"
      content="Ready for your next whitewater adventure? Contact Exciting Expeditions to book your rafting trip, ask questions, or connect with our expert guides today.">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/z-wwr-crossedoars.png" alt="Logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Contact Us</h1>
        <section class="company-info">

            <h2>Company Information</h2>
            <p>White Water Rafting Company</p>
            <p>Av. Integración casi, C. La Paz, Villa Tunari</p>
            <p>Villa Tunari, Bolivia</p>
            <p>+591 12345678</p>
            <p>info@whitewater.com</p>
        </section>

        <div class="map-form-grid">
            <section class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d5700.685138037544!2d-65.41844003317387!3d-16.976131655534182!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x93e443b1a70642a5%3A0x6a041a3c1905622b!2sBolivia%20Rafting!5e0!3m2!1ses-419!2sbo!4v1771015479218!5m2!1ses-419!2sbo"
                  width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>
            </section>

            <section class="contact-form">
                <form>


                    <fieldset>
                        <legend>Send us a message</legend>
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" required>

                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>

                        <div class="message-purpose">
                            <label>Message Purpose:</label>
                        </div>
                        <div class="purpose">

                            <label>
                                <input type="radio" name="purpose" value="general" required>
                                General Inquiry
                            </label>

                            <label>
                                <input type="radio" name="purpose" value="reservation">
                                Reservation Questions
                            </label>

                            <label>
                                <input type="radio" name="purpose" value="website">
                                Website Suggestion
                            </label>

                        </div>


                        <label for="message">Message</label>
                        <textarea name="message" id="message" rows="5" placeholder="Type here"
                          required></textarea>

                        <label>
                            <input type="checkbox" name="subscribe">
                            Please subscribe me to the monthly newsletter
                        </label>


                        <button type="submit">Get in Touch!</button>

                    </fieldset>
                </form>
            </section>
        </div>
        <section class="employees">
            <h2>We Are Here to Serve You</h2>

            <div class="employee-grid">
                <figure class="employee">
                    <img src="images/employee-1.jpeg" alt="Alex Rivera - Lead Guide">
                    <figcaption>
                        <strong>Alex Rivera</strong><br>
                        Lead Guide
                    </figcaption>
                </figure>

                <figure class="employee">
                    <img src="images/employee.jpeg" alt="Mia Torres - Trip Coordinator">
                    <figcaption>
                        <strong>Mia Torres</strong><br>
                        Trip Coordinator
                    </figcaption>
                </figure>

                <figure class="employee">
                    <img src="images/employee-2.jpeg" alt="Sam Patel - Safety Instructor">
                    <figcaption>
                        <strong>Sam Patel</strong><br>
                        Safety Instructor
                    </figcaption>
                </figure>
            </div>

        </section>
    </main>
    <footer>
        <p>©️2026🤽‍♂️Exciting Expeditions🤽‍♂️</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com/"><img src="images/facebook.svg" alt="facebook icon"
                  width="32"></a>
            <a href="https://www.instagram.com/"><img src="images/instagram-square.svg"
                  alt="instagram icon" width="32"></a>
            <a href="https://www.linkedin.com/"><img src="images/linkedin.svg" alt="linkedin icon"
                  width="32"></a>
        </nav>
    </footer>
</body>

</html>
